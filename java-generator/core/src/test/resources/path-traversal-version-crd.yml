# The version name contains path traversal segments that would cause generated files to escape
# the target directory if not validated. The containment check must reject this CRD.
# The group "example.com" adds two directory components (com/example), so ../../../../ is needed
# to traverse past them and then past the base path itself.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: escapes.example.com
spec:
  group: example.com
  versions:
    - name: ../../../../pwned
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                owned:
                  type: string
  scope: Namespaced
  names:
    plural: escapes
    singular: escape
    kind: Escape
