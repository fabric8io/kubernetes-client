# The version name feeds the generated package declaration, so a version carrying path separators
# would place generated files outside the target directory. The generated source cannot parse as
# Java, so the structural validation rejects this CRD while generating it, before anything is
# written. Note the escape does not come from the ".." segments: the package is split on ".", so no
# segment can ever be "..". It comes from the "/" segments, which Path#resolve treats as absolute
# and which reset the path to the filesystem root, whatever the number of leading "../".
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: escapes.example.com
spec:
  group: example.com
  versions:
    - name: ../../../../pwned
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                owned:
                  type: string
  scope: Namespaced
  names:
    plural: escapes
    singular: escape
    kind: Escape
