name: Generate Model

on:
  push:
    branches:
      - main
  pull_request:
    paths-ignore:
      - 'doc/**'
      - 'ide-config/**'
      - '**.md'

concurrency:
  # Only run once for latest commit per ref and cancel other (previous) runs.
  group: ci-go-kubernetes-client-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  generate-model:
    name: Kubernetes Model Generator Build
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: kubernetes-model-generator/openapi/generator/go.sum
      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
      - name: Verify Go module resolves on a clean checkout
        # Dependency bots run `go get`/`go mod tidy` before generation. The committed doc.go stubs keep that working;
        # this step catches a regression before the tree fills up with generated files.
        working-directory: kubernetes-model-generator/openapi/generator
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Generate model
        run: make generate-model
      - name: Check No Schema file modified
        run: |
          git add .
          IGNORED_PATTERNS="validation-schema.json"
          INCLUDE_PATTERNS="kube-schema.json\|openapi/generator/cmd/generated_\|src/generated/java\|src/generated-builders/java\|src/generated/resources\|openapi/schemas/"
          MODIFIED_FILES_COUNT=$(git status | grep -v "$IGNORED_PATTERNS" | grep "$INCLUDE_PATTERNS" | wc -l)
          if [ $MODIFIED_FILES_COUNT -eq "0" ]; then
            echo "No Schema files modified. Build Success.";
          else
            git status | grep -v "$IGNORED_PATTERNS" | grep "$INCLUDE_PATTERNS"
            echo "Schema files modified. Build Failure";
            exit 1;
          fi;
      - name: Cancel PR workflows on failure
        if: ${{ failure() && github.event_name == 'pull_request' }}
        uses: ./.github/actions/cancel-pr-workflows
